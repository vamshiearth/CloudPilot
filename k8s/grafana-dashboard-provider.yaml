apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cloudpilot

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: CloudPilot
        orgId: 1
        folder: CloudPilot
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards