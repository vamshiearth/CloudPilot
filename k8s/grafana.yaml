# ==================================================
# Grafana Prometheus Data Source
# ==================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloudpilot

data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: traceID

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        editable: false

        jsonData:
          httpMethod: GET

          serviceMap:
            datasourceUid: prometheus

          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"

            tags:
              - key: "service.name"
                value: "service"

            queries:
              - name: "Service span rate"
                query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'

---
# ==================================================
# Grafana Service
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudpilot

spec:
  type: NodePort

  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30091

---
# ==================================================
# Grafana Deployment
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudpilot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: cloudpilot-secrets
                  key: GRAFANA_ADMIN_USER

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpilot-secrets
                  key: GRAFANA_ADMIN_PASSWORD

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"

          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
              subPath: prometheus.yaml
              readOnly: true

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/cloudpilot.yaml
              subPath: dashboards.yaml
              readOnly: true

            - name: grafana-dashboard-cloudpilot
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboard-cloudpilot
          configMap:
            name: grafana-dashboard-cloudpilot
