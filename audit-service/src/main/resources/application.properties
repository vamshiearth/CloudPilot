spring.application.name=cloudpilot-audit-service
server.port=8082

# Audit PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudpilot_audit_db
spring.datasource.username=postgres
spring.datasource.password=${AUDIT_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cloudpilot-audit-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
cloudpilot.kafka.topic=cloudpilot.events

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
