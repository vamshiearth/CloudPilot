name: CloudPilot Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudpilot-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  core-dependency-scan:
    name: Core Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=8 \
              -DnvdApiKey="${NVD_API_KEY}"
          else
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=8
          fi

  audit-dependency-scan:
    name: Audit Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: audit-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=8 \
              -DnvdApiKey="${NVD_API_KEY}"
          else
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=8
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  core-image-scan:
    name: Core Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Core image
        run: docker build -t cloudpilot-core:security ./backend

      - name: Scan Core image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudpilot-core:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  audit-image-scan:
    name: Audit Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Audit image
        run: docker build -t cloudpilot-audit:security ./audit-service

      - name: Scan Audit image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudpilot-audit:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  frontend-image-scan:
    name: Frontend Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend image
        run: docker build -t cloudpilot-frontend:security ./frontend

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudpilot-frontend:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
