name: CloudPilot ECR Push

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudpilot-ecr-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-images:
    name: Build and Push Images
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Core image
        run: |
          docker build \
            -t ${{ vars.ECR_CORE_REPOSITORY }}:${{ github.sha }} \
            ./backend

      - name: Build Audit image
        run: |
          docker build \
            -t ${{ vars.ECR_AUDIT_REPOSITORY }}:${{ github.sha }} \
            ./audit-service

      - name: Build Frontend image
        run: |
          docker build \
            -t ${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            ./frontend

      - name: Push Core image
        run: docker push ${{ vars.ECR_CORE_REPOSITORY }}:${{ github.sha }}

      - name: Push Audit image
        run: docker push ${{ vars.ECR_AUDIT_REPOSITORY }}:${{ github.sha }}

      - name: Push Frontend image
        run: docker push ${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
