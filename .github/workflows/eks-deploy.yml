name: CloudPilot EKS Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudpilot-eks-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CloudPilot
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Verify cluster access
        run: |
          kubectl auth can-i get deployments -n cloudpilot
          kubectl auth can-i update deployments -n cloudpilot

      - name: Verify target deployments exist
        run: |
          kubectl -n cloudpilot get deployment core-backend
          kubectl -n cloudpilot get deployment audit-service
          kubectl -n cloudpilot get deployment frontend

      - name: Validate image tag
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"

          if [[ -z "$TAG" ]]; then
            echo "image_tag cannot be empty"
            exit 1
          fi

          if [[ "$TAG" == "latest" ]]; then
            echo "Refusing to deploy mutable tag: latest"
            exit 1
          fi

          echo "Deploying immutable image tag: $TAG"

      - name: Record current images
        run: |
          echo "Current Core:"
          kubectl -n cloudpilot get deployment core-backend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
          echo

          echo "Current Audit:"
          kubectl -n cloudpilot get deployment audit-service \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
          echo

          echo "Current Frontend:"
          kubectl -n cloudpilot get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
          echo

      - name: Update Core image
        run: |
          kubectl -n cloudpilot set image deployment/core-backend \
            core-backend=${{ vars.ECR_CORE_REPOSITORY }}:${{ inputs.image_tag }}

      - name: Update Audit image
        run: |
          kubectl -n cloudpilot set image deployment/audit-service \
            audit-service=${{ vars.ECR_AUDIT_REPOSITORY }}:${{ inputs.image_tag }}

      - name: Update Frontend image
        run: |
          kubectl -n cloudpilot set image deployment/frontend \
            frontend=${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ inputs.image_tag }}

      - name: Wait for Core rollout
        run: |
          kubectl -n cloudpilot rollout status deployment/core-backend \
            --timeout=5m

      - name: Wait for Audit rollout
        run: |
          kubectl -n cloudpilot rollout status deployment/audit-service \
            --timeout=5m

      - name: Wait for Frontend rollout
        run: |
          kubectl -n cloudpilot rollout status deployment/frontend \
            --timeout=5m

      - name: Deployment summary
        run: |
          kubectl -n cloudpilot get deployments
          kubectl -n cloudpilot get pods
