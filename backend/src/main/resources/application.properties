spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudpilot_db
spring.datasource.username=postgres
spring.datasource.password=cloudpilot

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:1s}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Kafka Consumer
spring.kafka.consumer.group-id=cloudpilot-backend-events
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

cloudpilot.kafka.topic=cloudpilot.events

# Audit Service
cloudpilot.audit-service.base-url=${AUDIT_SERVICE_BASE_URL:http://localhost:8082}

jwt.secret=cloudpilot-local-secret-change-me
jwt.expiration=3600000

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

cloudpilot.cost.metrics.refresh-ms=${CLOUDPILOT_COST_METRICS_REFRESH_MS:30000}
cloudpilot.cost.aws.enabled=false
